<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قارن قطر - امسح الباركود وقارن الأسعار</title>
<meta name="description" content="امسح باركود أي منتج في قطر وقارن أسعاره في المتاجر القريبة منك على الخريطة">
<meta name="theme-color" content="#8A1538">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#8A1538;--brand2:#5e0e26;--gold:#C9A24B;--bg:#f5f2ef;--card:#fff;--tx:#1f1a1c;--mu:#7a7174;--bd:#ece5e1;--ok:#14935a;--okbg:#e3f6ec;--warn:#b26a00;--warnbg:#fff3d9;--bad:#c62828;--sh:0 4px 18px rgba(60,20,30,.08);--in:#faf7f5}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Tajawal,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;padding-bottom:88px;font-size:15px;line-height:1.5}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.brand h1{margin:0;font-size:19px;font-weight:800;line-height:1.1}
.brand small{opacity:.85;font-size:12px}
.tools{display:flex;gap:6px}
.ib{border:0;background:rgba(255,255,255,.16);color:#fff;width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px;font-weight:700}
.ib:active{transform:scale(.94)}
.ib.sm{width:34px;height:34px;background:var(--in);color:var(--tx);font-size:15px}
.ib.star{background:var(--in);color:var(--mu);font-size:20px}
.ib.star.on{color:var(--gold)}
.locbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd);font-size:13px;color:var(--mu)}
.mini{border:0;background:var(--in);border-radius:10px;padding:4px 10px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px}
.view{display:none}.view.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px;margin-bottom:14px;border:1px solid var(--bd)}
.row{display:flex;align-items:center}.gap{gap:8px}.grow{flex:1}.wrap{flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:11px 14px;background:var(--in);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.btn.dark{background:var(--tx);color:var(--bg)}
.btn.gold{background:var(--gold);color:#2b2108}
.btn.ghost{background:transparent;border:1.5px solid var(--bd)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.camwrap{position:relative;border-radius:16px;overflow:hidden;background:#0d0a0b;aspect-ratio:4/3;margin-bottom:10px}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:18% 10%;pointer-events:none}
.frame i{position:absolute;width:26px;height:26px;border:4px solid var(--gold)}
.frame i:nth-child(1){top:0;inset-inline-start:0;border-width:4px 0 0 4px;border-radius:8px 0 0 0}
.frame i:nth-child(2){top:0;inset-inline-end:0;border-width:4px 4px 0 0;border-radius:0 8px 0 0}
.frame i:nth-child(3){bottom:0;inset-inline-start:0;border-width:0 0 4px 4px;border-radius:0 0 0 8px}
.frame i:nth-child(4){bottom:0;inset-inline-end:0;border-width:0 4px 4px 0;border-radius:0 0 8px 0}
.laser{position:absolute;left:6%;right:6%;height:2px;background:#ff3b5c;box-shadow:0 0 10px #ff3b5c;top:50%;animation:laser 1.6s ease-in-out infinite alternate;display:none}
.camwrap.live .laser{display:block}
@keyframes laser{from{top:8%}to{top:92%}}
.camph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;color:#efe6e9;gap:30px;padding:10px;background:radial-gradient(circle at 50% 38%,#6b1230 0,#2a0a15 55%,#140509 100%)}
.camph .hint{font-weight:700;font-size:14.5px;max-width:92%}
.camico{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#e0bd6a,#a8832f);box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 2px 4px rgba(255,255,255,.4)}
.camico svg{width:42px;height:42px;stroke-width:1.6;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.camico::before,.camico::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(224,189,106,.6);opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.camico::before{animation:ring 2.4s ease-out infinite}.camico::after{animation:ring 2.4s ease-out 1.2s infinite}}
@keyframes ring{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.ic{display:inline-flex;align-items:center}
.btn svg{width:21px;height:21px;flex:none}
#btnCam{font-size:16px;min-height:50px;box-shadow:0 6px 16px rgba(138,21,56,.35)}
.camwrap.live .camph{display:none}
input[type=text],input[type=number],input[type=search],select{width:100%;border:1.5px solid var(--bd);background:var(--in);border-radius:14px;padding:11px 13px;min-height:44px;outline:none}
input:focus,select:focus{border-color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1.5px solid var(--bd);background:var(--card);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.muted{color:var(--mu)}.sm{font-size:12.5px}
.prod{display:flex;gap:12px;align-items:flex-start}
.pimg{width:84px;height:84px;border-radius:16px;background:var(--in);display:grid;place-items:center;font-size:34px;overflow:hidden;flex:none}
.pimg img{width:100%;height:100%;object-fit:contain;background:#fff}
.pinfo{flex:1;min-width:0}
.pinfo h2{margin:0 0 2px;font-size:17px;line-height:1.35}
.code{direction:ltr;unicode-bidi:embed;display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--mu)}
.tg{display:inline-block;border-radius:8px;padding:1px 8px;font-size:11.5px;font-weight:700;background:var(--in);color:var(--mu);margin-inline-end:4px}
.tg.ok{background:var(--okbg);color:var(--ok)}.tg.warn{background:var(--warnbg);color:var(--warn)}.tg.gold{background:#f6ecd0;color:#7a5a00}
.nutri{color:#fff!important}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sechead h3{margin:0;font-size:16px}
.sum{display:flex;gap:10px;align-items:center;background:var(--okbg);color:var(--ok);border-radius:14px;padding:10px 12px;margin:10px 0;font-weight:700}
.sum .big{font-size:26px}
.prow{display:flex;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--bd)}
.prow.best{background:linear-gradient(90deg,transparent,var(--okbg));border-radius:12px}
.rk{width:26px;height:26px;border-radius:50%;background:var(--in);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.prow.best .rk{background:var(--ok);color:#fff}
.pm{flex:1;min-width:0}.sn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-weight:800;font-size:17px;white-space:nowrap}
.pa{display:flex;gap:4px;flex:none}
.empty{text-align:center;padding:18px 8px;color:var(--mu)}
.empty .bigico{font-size:40px}
.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.skel{height:84px;border-radius:16px;background:linear-gradient(90deg,var(--in),var(--bd),var(--in));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.bar{position:fixed;bottom:0;inset-inline:0;z-index:60;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.bar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:12px;color:var(--mu);cursor:pointer;font-weight:700;border-radius:14px;position:relative}
.bar button span{font-size:21px;line-height:1.1}
.bar button.on{color:var(--brand)}
html.dark .bar button.on{color:var(--gold)}
.bar button.on::before{content:"";position:absolute;top:-7px;width:32px;height:3px;border-radius:3px;background:var(--gold)}
.badge{position:absolute;top:0;inset-inline-end:28%;background:var(--brand);color:#fff;border-radius:10px;font-size:10.5px;padding:0 5px;min-width:16px}
#map{height:calc(100dvh - 300px);min-height:340px;border-radius:18px;direction:ltr;z-index:1;border:1px solid var(--bd)}
.leaflet-popup-content{margin:12px 14px;min-width:170px;font-family:Tajawal,sans-serif}
html[dir=rtl] .leaflet-popup-content{direction:rtl;text-align:right}
.pinwrap{background:none!important;border:0!important}
.pp{position:absolute;transform:translate(-50%,-100%);margin-top:-6px;background:var(--brand);color:#fff;font:800 12.5px Tajawal,sans-serif;padding:3px 8px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid #fff}
.pp::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--brand);border-bottom:0}
.pp.ok{background:var(--ok)}.pp.ok::after{border-top-color:var(--ok)}
.pp.demo{opacity:.82;background:#6d6264}.pp.demo::after{border-top-color:#6d6264}
.pp.demo.ok{background:#3f8f6a}.pp.demo.ok::after{border-top-color:#3f8f6a}
.sd{position:absolute;width:14px;height:14px;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--brand);border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.pickbar{background:var(--brand);color:#fff;border-radius:12px;padding:8px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mapstrip{margin-bottom:8px;font-weight:700}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;opacity:0;pointer-events:none;transition:.2s}
#sheet{position:fixed;bottom:0;inset-inline:0;max-width:720px;margin:0 auto;z-index:101;background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
body.sh #sheetBg{opacity:1;pointer-events:auto}body.sh #sheet{transform:none}
.grab{width:44px;height:5px;background:var(--bd);border-radius:5px;margin:0 auto 12px}
#sheet h3{margin:0 0 10px}
.fld{margin-bottom:10px}.fld label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px;font-weight:700}
.big-in{font-size:26px!important;font-weight:800;text-align:center}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.lnk{display:flex;align-items:center;gap:10px;padding:13px;border-radius:14px;background:var(--in);margin-bottom:8px;text-decoration:none;color:var(--tx);font-weight:700}
.hrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}
.hrow .t{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:10px;border:0;background:var(--in);font-weight:800;cursor:pointer}
#toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,30px);background:#222;color:#fff;padding:10px 16px;border-radius:14px;z-index:200;opacity:0;transition:.25s;max-width:90vw;text-align:center;pointer-events:none;font-weight:700;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:12px;color:var(--mu);padding:8px 0 4px}
.foot a{color:inherit}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">🛒</div><div><h1 data-i="app">قارن قطر</h1><small data-i="tag">امسح • قارن • وفّر</small></div></div>
  <div class="tools">
    <button class="ib" id="btnLang" data-act="lang" aria-label="language">EN</button>
    <button class="ib" id="btnTheme" data-act="theme" aria-label="theme">🌙</button>
    <button class="ib" data-act="settings" aria-label="settings">⚙️</button>
  </div>
</header>
<div class="locbar" id="locBar"></div>

<main>
  <section id="v-scan" class="view active">
    <div class="card">
      <div class="camwrap" id="camWrap">
        <video id="video" playsinline muted autoplay></video>
        <div class="frame"><i></i><i></i><i></i><i></i><span class="laser"></span></div>
        <div class="camph"><div class="camico"><i class="ic" data-ic="cam"></i></div><div class="hint" data-i="camHint">وجّه الكاميرا نحو الباركود</div></div>
      </div>
      <div class="row gap">
        <button class="btn primary grow" id="btnCam" data-act="cam"></button>
        <button class="btn hidden" id="btnTorch" data-act="torch" aria-label="flash">🔦</button>
        </div>
      <div class="row gap" style="margin-top:8px">
        <button class="btn gold grow" data-act="photo"><i class="ic" data-ic="cam"></i><span data-i="photoBtn">صوّر المنتج</span></button>
        <button class="btn grow" data-act="img"><i class="ic" data-ic="gallery"></i><span data-i="galleryBtn">من الاستوديو</span></button>
        <input type="file" id="filePhoto" accept="image/*" capture="environment" hidden>
        <input type="file" id="fileImg" accept="image/*" hidden>
      </div>
      <div class="muted sm" data-i="photoHint" style="margin-top:8px"></div>
      <form data-form="manual" class="row gap" style="margin-top:10px" autocomplete="off">
        <input type="text" id="codeIn" inputmode="numeric" maxlength="20" data-ip="manualPh" placeholder="أو اكتب رقم الباركود">
        <button class="btn dark" type="submit" aria-label="search">🔍</button>
      </form>
      <div class="chips" id="recent"></div>
    </div>
    <div id="result"></div>
  </section>

  <section id="v-map" class="view">
    <div id="pickBar"></div>
    <div class="mapstrip" id="mapStrip"></div>
    <div class="row gap wrap" style="margin-bottom:8px">
      <button class="chip" data-act="relocate">📍 <span data-i="myLoc">موقعي</span></button>
      <button class="chip" data-act="pickloc">✋ <span data-i="setLoc">حدد موقعي يدويًا</span></button>
      <button class="chip" data-act="pickstore">➕ <span data-i="addStore">أضف متجرًا</span></button>
      <button class="chip" id="chipAll" data-act="allQatar">🇶🇦 <span data-i="allQatar">كل قطر</span></button>
    </div>
    <div id="map"></div>
    <div class="foot" data-i="mapCredit">الخريطة والمتاجر: © مساهمو OpenStreetMap</div>
  </section>

  <section id="v-saved" class="view"></section>
  <section id="v-list" class="view"></section>
</main>

<nav class="bar">
  <button data-act="tab" data-v="scan" class="on"><span>📷</span><b data-i="tScan">مسح</b></button>
  <button data-act="tab" data-v="map"><span>🗺️</span><b data-i="tMap">الخريطة</b></button>
  <button data-act="tab" data-v="saved"><span>⭐</span><b data-i="tSaved">محفوظاتي</b></button>
  <button data-act="tab" data-v="list"><span>🧺</span><b data-i="tList">قائمتي</b><i class="badge hidden" id="listBadge"></i></button>
</nav>
<div id="sheetBg" data-act="close"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

function validGtin(c){if(!/^(\d{8}|\d{12,14})$/.test(c))return false;const d=c.split('').map(Number),k=d.pop();let s=0;d.reverse().forEach((x,i)=>{s+=x*(i%2===0?3:1)});return(10-s%10)%10===k}

const cam={on:false,stream:null,timer:null,detector:null,last:null,cnt:0,zx:null,cv:null,torch:false};
async function initDetector(){
  if('BarcodeDetector' in window){try{const sup=await BarcodeDetector.getSupportedFormats();const f=['ean_13','ean_8','upc_a','upc_e','code_128','itf'].filter(x=>sup.includes(x));if(f.length)cam.detector=new BarcodeDetector({formats:f})}catch(e){}}
}
function zxReady(){
  if(cam.zx)return true;
  if(typeof ZXing==='undefined')return false;
  try{const r=new ZXing.MultiFormatReader(),h=new Map();
    h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.ITF]);
    h.set(ZXing.DecodeHintType.TRY_HARDER,true);r.setHints(h);cam.zx=r;cam.cv=document.createElement('canvas');return true}catch(e){return false}
}
function zxDecode(src,w,h){
  if(!zxReady())return null;
  try{const c=cam.cv;c.width=w;c.height=h;c.getContext('2d',{willReadFrequently:true}).drawImage(src,0,0,w,h);
    const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)));
    return cam.zx.decode(bmp).getText()}catch(e){return null}
}
async function startCam(){
  if(cam.on)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast(window.isSecureContext===false?t('needHttps'):t('camNone'));return}
  try{
    cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    const n=e&&e.name;toast(n==='NotAllowedError'||n==='SecurityError'?(window.isSecureContext===false?t('needHttps'):t('camDenied')):n==='NotFoundError'||n==='OverconstrainedError'?t('camNone'):t('camErr'));return}
  const v=$('#video');v.srcObject=cam.stream;
  try{await v.play()}catch(e){}
  cam.on=true;cam.last=null;cam.cnt=0;$('#camWrap').classList.add('live');
  const tr=cam.stream.getVideoTracks()[0];let tc=false;
  try{const caps=tr.getCapabilities?tr.getCapabilities():{};tc=!!caps.torch}catch(e){}
  $('#btnTorch').classList.toggle('hidden',!tc);cam.torch=false;
  updateCamBtn();scanFrame();
}
function stopCam(){
  cam.on=false;clearTimeout(cam.timer);
  if(cam.stream){cam.stream.getTracks().forEach(x=>x.stop());cam.stream=null}
  const v=$('#video');v.srcObject=null;$('#camWrap').classList.remove('live');$('#btnTorch').classList.add('hidden');updateCamBtn();
}

async function scanFrame(){
  if(!cam.on)return;
  const v=$('#video');let code=null;
  try{
    if(v.readyState>=2&&v.videoWidth){
      if(cam.detector){const r=await cam.detector.detect(v);if(r&&r.length)code=r[0].rawValue}
      if(!code&&zxReady()){const w=Math.min(v.videoWidth,960),h=Math.round(w*v.videoHeight/v.videoWidth);code=zxDecode(v,w,h)}
    }
  }catch(e){}
  if(code){
    code=normKey(normDigits(code));
    if(validGtin(code)&&[8,13,14].includes(code.length)){if(code===cam.last)cam.cnt++;else{cam.last=code;cam.cnt=1}
      if(cam.cnt>=1){stopCam();onCode(code);return}}
  }
  cam.timer=setTimeout(scanFrame,cam.detector?110:200);
}

    const sizes=[1600,1000,700];

async function fetchJSON(url,ms){const c=new AbortController(),id=setTimeout(()=>c.abort(),ms||9000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('http '+r.status);return await r.json()}finally{clearTimeout(id)}}

const FIELDS='product_name,product_name_ar,product_name_en,generic_name,brands,quantity,image_front_small_url,image_front_url,nutriscore_grade';
async function lookupProduct(code){
  S.netErr=false;
  if(S.custom[code])return Object.assign({},S.pcache[code]||{},S.custom[code],{custom:true});
  if(S.pcache[code])return S.pcache[code];
  let ok=0,fail=0;
  for(const host of HOSTS){
    for(const v of (code.length===13&&code[0]==='0'?[code,code.slice(1)]:[code])){
      try{
        const j=await fetchJSON(`https://${host}/api/v2/product/${v}.json?fields=${FIELDS}`);ok++;
        if(j&&j.status===1&&j.product){
          const p=j.product;
          const name=(S.lang==='ar'&&p.product_name_ar)||p.product_name||p.product_name_en||p.generic_name||p.product_name_ar||'';
          if(name||p.brands){
            const r={name:name||'',brand:(p.brands||'').split(',')[0].trim(),qty:p.quantity||'',img:p.image_front_small_url||p.image_front_url||'',nutri:/^[a-e]$/i.test(p.nutriscore_grade||'')?p.nutriscore_grade.toUpperCase():''};
            S.pcache[code]=r;const ks=Object.keys(S.pcache);if(ks.length>250)delete S.pcache[ks[0]];save('pcache',S.pcache);return r}
        }
      }catch(e){fail++}
    }
  }
  if(ok===0&&fail>0)S.netErr=true;
  return null;
}

const ID_PROMPT='You are a product recognition expert for the Qatar retail market. Identify the retail consumer product shown in the photo (packaged food, drink, household item, cosmetics, electronics, etc.). Read the visible text on the packaging (Arabic or English) and rely on it. Do not invent details: if unsure, lower the confidence. If a barcode number is clearly readable, return its digits, otherwise an empty string.';
async function aiIdentify(b64){
  const img={inlineData:{mimeType:'image/jpeg',data:b64}};
  const schema={type:'OBJECT',properties:{is_product:{type:'BOOLEAN'},name_en:{type:'STRING'},name_ar:{type:'STRING'},brand:{type:'STRING'},size:{type:'STRING'},category:{type:'STRING'},search_query:{type:'STRING'},barcode:{type:'STRING'},confidence:{type:'NUMBER'}},required:['is_product','name_en','name_ar','brand','size','category','search_query','barcode','confidence']};

    if(e instanceof AiErr&&e.kind==='gen')j=await aiGenerate({contents:[{role:'user',parts:[{text:ID_PROMPT+' Reply with ONLY one JSON object with keys: is_product (boolean), name_en, name_ar, brand, size, category, search_query, barcode, confidence (0 to 1).'},img]}]},45000);

}
function parsePrices(text){

    line=line.replace(/^\s*\|/,'').replace(/\|\s*$/,'').trim();
    const m=line.match(/^[\s>*•\-–]*([^|]+?)\s*\|\s*([0-9٠-٩][0-9٠-٩.,٫]*)\s*(?:QAR|QR|ر\.?\s?ق|ريال)?\s*(?:\|\s*(.*))?$/i);

    if(!isFinite(price)||price<0.25||price>20000)return;

async function onCode(raw){

/* ============ الأحداث ============ */
const H={
  tab:d=>showView(d.v),cam:()=>cam.on?stopCam():startCam(),torch:toggleTorch,img:()=>$('#fileImg').click(),
  open:d=>{closeSheet();onCode(d.code)},fav:()=>toggleFav(S.code),addp:d=>openAddPrice(d.sid||null),
  list:d=>addToList(d.code||S.code),share:shareResult,edit:openEdit,dir:d=>openDir(d.sid),onmap:d=>{closeSheet();focusStore(d.sid)},hist:d=>openHist(d.sid),
  sort:d=>{S.sort=d.v;renderResult()},relocate:doRelocate,reloadStores:()=>loadStores(true),allQatar:toggleAllQatar,pickloc:()=>setPick('loc'),pickstore:()=>setPick('store'),cancelpick:()=>setPick(null),
  close:closeSheet,settings:openSettings,
  lang:()=>{S.lang=S.lang==='ar'?'en':'ar';save('lang',S.lang);applyLang();rebuildStores();renderAll();if(document.body.classList.contains('sh'))openSettings()},
  theme:()=>{S.dark=!S.dark;save('dark',S.dark);applyTheme()},
  demoOff:()=>{S.demo=false;save('demo',false);renderAll()},
  clearHist:()=>{S.history=[];save('history',S.history);renderSaved();renderRecent()},
  clearList:()=>{S.list=[];save('list',S.list);renderList()},
  rmList:d=>{S.list=S.list.filter(i=>i.code!==d.code);save('list',S.list);renderList()},
  qty:d=>{const i=S.list.find(x=>x.code===d.code);if(!i)return;i.qty=Math.max(1,Math.min(99,i.qty+(+d.d)));save('list',S.list);renderList()},
  delPrice:d=>{S.prices=S.prices.filter(p=>p.id!==d.id);save('prices',S.prices);toast(t('deleted'));renderAll();allFor(S.code).some(p=>p.storeId===d.sid)?openHist(d.sid):closeSheet()},
  export:exportData,import:()=>$('#fileImp').click(),cloudSave,copyRules,
  photo:()=>$('#filePhoto').click(),aiSave,aiRetry:()=>{if(S.ai&&S.ai.info)aiFindPrice(S.ai)},aiEdit:openAiEdit,aiCode:()=>{if(S.ai&&S.ai.info)onCode(S.ai.info.barcode)},
  clearAll:()=>{if(confirm(t('confirmClear'))){['prices','mystores','custom','pcache','history','favs','list','pos'].forEach(k=>{try{localStorage.removeItem('qp_'+k)}catch(e){}});S.prices=[];S.myStores=[];S.custom={};S.pcache={};S.history=[];S.favs=[];S.list=[];S.code=null;S.product=null;rebuildStores();closeSheet();renderAll()}}
};
function dispatch(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=H[b.dataset.act];if(f){if(b.tagName!=='INPUT'&&b.tagName!=='SELECT')e.preventDefault();f(b.dataset,b,e)}
}
document.addEventListener('click',dispatch);
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='fileImg'||el.id==='filePhoto'){const f=el.files&&el.files[0];el.value='';if(f)scanImageFile(f);return}
  if(el.id==='fileImp'){const f=el.files&&el.files[0];el.value='';if(f)importData(f);return}
  const k=el.dataset&&el.dataset.set;if(!k)return;
  if(k==='dark'){S.dark=el.checked;save('dark',S.dark);applyTheme()}
  else if(k==='demo'){S.demo=el.checked;save('demo',S.demo);renderAll()}
  else if(k==='radius'){S.radius=+el.value;save('radius',S.radius);rebuildStores();loadStores(true);if(map)map.setView([S.pos.lat,S.pos.lon],zoomFor())}
});
document.addEventListener('submit',e=>{
  const f=e.target,kind=f.dataset&&f.dataset.form;if(!kind)return;e.preventDefault();
  if(kind==='manual'){const v=normDigits(f.querySelector('input').value).replace(/\D/g,'');f.querySelector('input').blur();if(v)onCode(v)}
  else if(kind==='price')saveStoreAndPrice(f);
  else if(kind==='newstore'){
    const n=f.n.value.trim();if(!n)return;
    const st={id:'u'+uid(),n0:n,lat:+f.dataset.lat,lon:+f.dataset.lon,shop:'',hours:''};
    S.myStores.push(st);save('mystores',S.myStores);rebuildStores();toast(t('storeAdded'));closeSheet();renderAll();if(S.code)setTimeout(()=>openAddPrice(st.id),350)
  }
  else if(kind==='aiedit'){
    const n=f.n.value.trim();if(!n||!S.ai||!S.ai.info)return;const i=S.ai.info,ar=/[؀-ۿ]/.test(n);
    i.nameAr=ar?n:'';i.nameEn=ar?'':n;i.brand=f.b.value.trim();i.conf=1;i.isProduct=true;i.query=n;closeSheet();aiFindPrice(S.ai)
  }
  else if(kind==='edit'){
    const n=f.n.value.trim();if(!n)return;S.custom[S.code]={name:n,brand:f.b.value.trim()};save('custom',S.custom);
    S.product=Object.assign({},S.product||{},S.custom[S.code]);const h=S.history.find(x=>x.code===S.code);if(h)h.name=n;save('history',S.history);closeSheet();renderAll()
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();if(S.pick)setPick(null)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cam.on)stopCam()});
window.addEventListener('pagehide',()=>{if(cam.on)stopCam()});

/* ============ البدء ============ */
(async function init(){
  applyTheme();applyLang();rebuildStores();renderAll();
  try{if(localStorage.getItem('qp_demo')===null&&cloudOn()){S.demo=false;renderAll()}}catch(e){}
  initDetector();syncPending();
  const ok=await locate();
  renderLocBar();
  await loadStores();
})();
</script>
</body>
</html>
